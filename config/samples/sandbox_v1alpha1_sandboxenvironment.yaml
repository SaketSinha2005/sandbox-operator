apiVersion: sandbox.mylab.io/v1alpha1
kind: SandboxEnvironment
metadata:
  labels:
    app.kubernetes.io/name: sandboxenvironment
    app.kubernetes.io/instance: sandboxenvironment-sample
    app.kubernetes.io/part-of: sandbox-operator
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/created-by: sandbox-operator
  name: sandboxenvironment-sample
spec:
  # TODO(user): Add fields here
  runtime:
    image: python:3.12
    language: python
    command:
      - python3
      - /workspace/main.py

  resources:
    requests:
      cpu: "250m"
      memory: "256Mi"
    limits:
      cpu: "1"
      memory: "512Mi"

  storage:
    size: "1Gi"
    mountPath: "/workspace"

  network:
    enabled: false

  security:
    runAsNonRoot: true
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false

  timeout: 30
