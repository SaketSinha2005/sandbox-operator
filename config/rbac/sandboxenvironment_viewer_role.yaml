# permissions for end users to view sandboxenvironments.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: clusterrole
    app.kubernetes.io/instance: sandboxenvironment-viewer-role
    app.kubernetes.io/component: rbac
    app.kubernetes.io/created-by: sandbox-operator
    app.kubernetes.io/part-of: sandbox-operator
    app.kubernetes.io/managed-by: kustomize
  name: sandboxenvironment-viewer-role
rules:
- apiGroups:
  - sandbox.mylab.io
  resources:
  - sandboxenvironments
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - sandbox.mylab.io
  resources:
  - sandboxenvironments/status
  verbs:
  - get
