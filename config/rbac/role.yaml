---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - sandbox.mylab.io
  resources:
  - sandboxenvironments
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - sandbox.mylab.io
  resources:
  - sandboxenvironments/finalizers
  verbs:
  - update
- apiGroups:
  - sandbox.mylab.io
  resources:
  - sandboxenvironments/status
  verbs:
  - get
  - patch
  - update
