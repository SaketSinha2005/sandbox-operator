# permissions for end users to edit sandboxenvironments.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: clusterrole
    app.kubernetes.io/instance: sandboxenvironment-editor-role
    app.kubernetes.io/component: rbac
    app.kubernetes.io/created-by: sandbox-operator
    app.kubernetes.io/part-of: sandbox-operator
    app.kubernetes.io/managed-by: kustomize
  name: sandboxenvironment-editor-role
rules:
- apiGroups:
  - sandbox.mylab.io
  resources:
  - sandboxenvironments
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - sandbox.mylab.io
  resources:
  - sandboxenvironments/status
  verbs:
  - get
